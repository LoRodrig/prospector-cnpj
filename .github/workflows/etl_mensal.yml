name: Geocodificação — Prospector CNPJ

# O ETL da Receita NÃO roda aqui: a Receita bloqueia os IPs do GitHub Actions.
# Rode o ETL localmente (python etl/cnpjs_receita.py) e deixe a geocodificação
# dos endereços pendentes por conta deste workflow.
#
# Roda todo dia às 06:00 UTC (03:00 em Brasília).
on:
  schedule:
    - cron: "0 6 * * *"

  # Permite rodar manualmente pelo botão "Run workflow" na aba Actions
  workflow_dispatch:
    inputs:
      limite:
        description: "Limite de endereços a geocodificar nesta execução"
        required: false
        default: "3000"

env:
  PYTHON_VERSION: "3.11"

jobs:
  geocodificar:
    name: Geocodificar endereços pendentes
    runs-on: ubuntu-latest
    timeout-minutes: 300

    steps:
      - name: Checkout do repositório
        uses: actions/checkout@v5

      - name: Configurar Python ${{ env.PYTHON_VERSION }}
        uses: actions/setup-python@v6
        with:
          python-version: ${{ env.PYTHON_VERSION }}
          cache: pip
          cache-dependency-path: etl/requirements.txt

      - name: Instalar dependências
        run: pip install -r etl/requirements.txt

      # Secrets em: Settings → Secrets and variables → Actions
      - name: Criar arquivo .env
        run: |
          {
            echo "SUPABASE_HOST=${{ secrets.SUPABASE_HOST }}"
            echo "SUPABASE_PORT=${{ secrets.SUPABASE_PORT }}"
            echo "SUPABASE_DB=${{ secrets.SUPABASE_DB }}"
            echo "SUPABASE_USER=${{ secrets.SUPABASE_USER }}"
            echo "SUPABASE_PASSWORD=${{ secrets.SUPABASE_PASSWORD }}"
            echo "SUPABASE_PROJECT_REF=${{ secrets.SUPABASE_PROJECT_REF }}"
            echo "NOMINATIM_EMAIL=${{ secrets.NOMINATIM_EMAIL }}"
          } > etl/.env

      - name: Geocodificar endereços pendentes
        working-directory: etl
        run: |
          LIMITE="${{ github.event.inputs.limite || '3000' }}"
          python geocodificar_supabase.py \
            --limite "$LIMITE" \
            --lote 100 \
            --delay 1.2 \
            --pausa-lote 5

      - name: Remover .env após a execução
        if: always()
        run: rm -f etl/.env
